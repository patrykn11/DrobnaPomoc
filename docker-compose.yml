version: '3.0'

services:
  db:
    image: postgres:15
    container_name: postgre_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  backend:
    build: ./backend
    container_name: backend
    volumes: 
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=postgres_db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432

    depends_on:
      db:
        condition: service_healthy
        restart: true


volumes:
  postgres_data: